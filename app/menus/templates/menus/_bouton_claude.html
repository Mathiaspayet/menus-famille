{% comment %}Bouton vers Claude. Avec un projet configuré, claude.js copie d'abord la question.{% endcomment %}
<a class="claude" href="{{ lien_claude.url }}" target="_blank" rel="noopener"{% if lien_claude.projet %} data-copier="{{ lien_claude.question }}"{% endif %}>✦ {{ texte }}</a>
{% if lien_claude.projet %}<p class="claude-aide">La question est copiée : collez-la dans le projet « Menus famille ».</p>{% endif %}
