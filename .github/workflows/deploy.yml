# ============================================================
# GitHub Actions - Tests puis construction de l'image Docker
# ============================================================
# À chaque push sur main : on lance les tests ; s'ils passent, on construit
# l'image et on la publie sur GitHub Container Registry (ghcr.io).
# Watchtower, sur le NAS, voit la nouvelle image et redéploie tout seul.
# ============================================================

name: Tests & déploiement

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tests
        working-directory: app
        env:
          DJANGO_DEBUG: "True"
          DATA_DIR: /tmp/menus-data
        run: python manage.py test menus

  image:
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
      # Le NAS (DS218+) est en x86_64 : amd64 suffit.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
